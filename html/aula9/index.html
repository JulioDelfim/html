<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — Class e ID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a href ="../index.html"><button>Voltar</button></a>

  <main>
    <h1>👟 Catalogo</h1>

    <!-- CLASSE + ID: herda o visual de .card e o ID sobrescreve o que muda -->
    <div class="card " id="promo-dia">
      <h4>Promoção do dia</h4>
      <p>Chuteira nike mercurial + Meião preto. por  R$ 269,99</p>
    </div>

    <!-- SÓ A CLASSE BASE -->
    <div class="card">
      <h4>Phantom gx</h4>
      <p>Chutera addidas Phantom gx. R$ 400,00</p>
    </div>

    <!-- DUAS CLASSES: card + destaque (separadas por espaço) -->
    <div class="card destaque">
      <h4>Umbro saint patricks day</h4>
      <p>O mais pedido da casa. R$ 370,90</p>
    </div>

    <!-- DUAS CLASSES: card + esgotado -->
    <div class="card esgotado">
      <h4>Puma Neymar future</h4>
      <p>Volta amanhã! R$ 400,00</p>
    </div>
  </main>

</body>
</html>
