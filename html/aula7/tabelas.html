<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de compras</title>
</head>
<a href ="../index.html"><button>home</button></a>
</main>
<body style="font-family: Arial, sans-serif; font-weight: 900; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; box-sizing: border-box;">

    <!-- Container centralizado na horizontal e posicionado na parte de cima -->
    <div style="width: 100%; max-width: 800px; margin: 0 auto;">
        
        <h1 style="text-align: center; margin-top: 0;">Carrinho de compras / Orçamento</h1>
        
        <table style="border-collapse: collapse; width: 100%; margin: 0 auto;">
            <thead>
                <tr>
                    <th style="background-color: rgb(255, 60, 0); color: white; padding: 8px; text-align: left;">Produto</th>
                    <th style="background-color: rgb(255, 0, 0); color: white; padding: 8px; text-align: left;">Preço</th>
                    <th style="background-color: #ff0000; color: white; padding: 8px; text-align: center;">Quantidade</th>
                    <th style="background-color: rgb(255, 0, 0); color: white; padding: 8px; text-align: right;">Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="padding: 8px; text-align: left;">Video game</td>
                    <td style="padding: 8px; text-align: left;">R$ 1000,00</td>
                    <td style="padding: 8px; text-align: center;">10</td>
                    <td style="padding: 8px; text-align: right;">R$ 10000,00</td>
                </tr>
                <!-- Monitor apenas com cor de fundo -->
                <tr style="background-color: #f9f9f9;">
                    <td style="padding: 8px; text-align: left;">Monitor</td>
                    <td style="padding: 8px; text-align: left;">R$ 999,00</td>
                    <td style="padding: 8px; text-align: center;">5</td>
                    <td style="padding: 8px; text-align: right;">R$ 4995,00</td>
                </tr>
                <tr>
                    <td style="padding: 8px; text-align: left;">Teclado</td>
                    <td style="padding: 8px; text-align: left;">R$ 150,00</td>
                    <td style="padding: 8px; text-align: center;">3</td>
                    <td style="padding: 8px; text-align: right;">R$ 450,00</td>
                </tr>
                <!-- Geladeira apenas com cor de fundo -->
                <tr style="background-color: #f9f9f9;">
                    <td style="padding: 8px; text-align: left;">Geladeira</td>
                    <td style="padding: 8px; text-align: left;">R$ 3500,00</td>
                    <td style="padding: 8px; text-align: center;">2</td>
                    <td style="padding: 8px; text-align: right;">R$ 7000,00</td>
                </tr>
                <!-- Mouse apenas com cor de fundo -->
                <tr style="background-color: #f9f9f9;">
                    <td style="padding: 8px; text-align: left;">Mouse</td>
                    <td style="padding: 8px; text-align: left;">R$ 80,00</td>
                    <td style="padding: 8px; text-align: center;">4</td>
                    <td style="padding: 8px; text-align: right;">R$ 320,00</td>
                </tr>
            </tbody>
            <tfoot style="background-color: #eceef1; border-top: 2px solid #2c3e50;">
                <tr>
                    <td colspan="3" style="padding: 8px; text-align: right;">Valor Total:</td>
                    <td style="padding: 8px; text-align: right;">R$ 22765,00</td>
                </tr>
            </tfoot>
        </table>
        
    </div>
</body>
</html>
